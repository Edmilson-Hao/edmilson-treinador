<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Edmilson Treinador - App de treinos personalizados">
  <title>Edmilson Treinador</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/icons/icon-192.png">
</head>
<body>
  <!-- Splash -->
  <div id="splash">
    <div class="splash-logo">ET</div>
    <div class="splash-title">Edmilson Treinador</div>
    <div class="spinner"></div>
  </div>

  <!-- Offline badge -->
  <div id="offline-badge" class="offline-badge">Você está offline</div>

  <!-- App root -->
  <div id="app"></div>

  <!-- Firebase SDK (compat para vanilla simples) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>

  <!-- App -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
